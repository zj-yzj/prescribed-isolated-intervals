[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prescribed-isolated-intervals"
version = "0.2.0"
description = "Reproducible constructions for prescribed isolated intervals in higher-fold sumsets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [{ name = "Zijie Yu", email = "256001428@nbu.edu.cn" }]
dependencies = []

[project.scripts]
interval-bases = "interval_bases.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
